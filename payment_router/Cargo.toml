[package]
name = "payment_router"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[features]
testutils = ["soroban-sdk/testutils"]

[dependencies]
soroban-sdk = { version = "20.0.0", features = ["testutils"] }
derive_arbitrary = "=1.3.2"

[patch.crates-io]
ethnum = { path = "ethnum-patch" }

[dev-dependencies]
arbitrary = { version = "=1.3.2", optional = false }
derive_arbitrary = { version = "=1.3.2", optional = false }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
